<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro semanal de composta</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#e8f1e4;height:100dvh;display:flex;flex-direction:column}
header{background:#2f6b3a;color:#fff;padding:14px 16px;font-size:18px;font-weight:600}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;max-width:720px;width:100%;margin:0 auto}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.4;font-size:17px}
.bot{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.yo{background:#2f6b3a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
#sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 6px;max-width:720px;width:100%;margin:0 auto}
#sug button{border:1px solid #2f6b3a;background:#fff;color:#2f6b3a;border-radius:18px;padding:8px 14px;font-size:16px}
form{display:flex;gap:8px;padding:10px 14px;background:#fff;max-width:720px;width:100%;margin:0 auto}
input{flex:1;font-size:17px;padding:12px;border:1px solid #bbb;border-radius:10px}
form button{background:#2f6b3a;color:#fff;border:0;border-radius:10px;padding:0 20px;font-size:17px}
</style></head><body>
<header>🌱 Registro semanal de composta · Central de Abastos</header>
<div id="log" aria-live="polite"></div><div id="sug"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Escribe tu respuesta…" maxlength="500"><button>Enviar</button></form>
<script>
const sid = sessionStorage.sid || (sessionStorage.sid = crypto.randomUUID());
const log = document.getElementById('log'), sug = document.getElementById('sug'), t = document.getElementById('t');
function add(txt, cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight}
async function enviar(msg){
  if(msg!==''){add(msg,'yo')}
  sug.innerHTML='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sid,mensaje:msg})});
    const j=await r.json();
    (j.mensajes||[j.error||'Error']).forEach(m=>add(m,'bot'));
    (j.sugerencias||[]).forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>enviar(s);sug.appendChild(b)});
  }catch{add('No pude conectarme. Intenta de nuevo.','bot')}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=t.value.trim();if(!v)return;t.value='';enviar(v)};
enviar('');
</script></body></html>
